<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuickTools</title>

<style>
body{
  font-family:Arial,sans-serif;
  margin:0;
  background:#f5f7fb;
  text-align:center;
}

header{
  background:#111827;
  color:white;
  padding:35px 15px;
}

h1{
  margin:0;
  font-size:40px;
}

.tools{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  align-items:flex-start;
  gap:20px;
  padding:35px;
}

.box{
  background:white;
  padding:25px;
  width:220px;
  border-radius:15px;
  box-shadow:0 3px 12px #ccc;
  box-sizing:border-box;
}

button{
  padding:10px 18px;
  background:#111827;
  color:white;
  border:0;
  border-radius:7px;
  cursor:pointer;
}

input{
  padding:10px;
  max-width:90%;
}

#age{
  background:white;
  margin:10px auto 40px;
  padding:25px;
  max-width:450px;
  border-radius:15px;
  box-sizing:border-box;
  box-shadow:0 3px 12px #ccc;
}

#compress{
  background:white;
  margin:10px auto 40px;
  padding:25px;
  max-width:450px;
  border-radius:15px;
  box-sizing:border-box;
  box-shadow:0 3px 12px #ccc;
}

#result,#compressResult{
  font-weight:bold;
  margin-top:20px;
}

.download{
  display:inline-block;
  margin-top:15px;
  padding:10px 18px;
  background:#111827;
  color:white;
  text-decoration:none;
  border-radius:7px;
}
</style>
</head>

<body>

<header>
<h1>QuickTools</h1>
<p>Simple & Free Online Tools</p>
</header>

<div class="tools">

<div class="box">
<h2>🖼️ Image Compressor</h2>
<p>Compress images easily.</p>
<button onclick="document.getElementById('compress').scrollIntoView()">
Open Tool
</button>
</div>

<div class="box">
<h2>📏 Image Resizer</h2>
<input type="file" id="resizeInput" accept="image/*">
<br><br>
<label>Width:</label>
<input type="number" id="resizeWidth" placeholder="Width">
<br><br>
<label>Height:</label>
<input type="number" id="resizeHeight" placeholder="Height">
<br><br>
<button onclick="resizeImage()">Resize Image</button>
<p id="resizeResult"></p>
</div>

<div class="box">
<h2>🧮 Age Calculator</h2>
<p>Calculate your age instantly.</p>
<button onclick="document.getElementById('age').scrollIntoView()">
Open Tool
</button>
</div>

<div class="box">
<h2>🔄 Unit Converter</h2>
<p>Convert different units easily.</p>
<button>Open Tool</button>
</div>

</div>

<div id="compress">

<h2>🖼️ Image Compressor</h2>

<input type="file" id="compressInput" accept="image/*">

<br><br>

<button onclick="compressImage()">Compress Image</button>

<p id="compressResult"></p>

</div>

<div id="age">

<h2>Age Calculator</h2>

<input type="date" id="dob">

<br><br>

<button onclick="calculateAge()">Calculate Age</button>

<p id="result"></p>

</div>

<script>

function compressImage(){

  const input = document.getElementById("compressInput");
  const result = document.getElementById("compressResult");

  if(!input.files || !input.files[0]){
    result.innerText = "Please select an image first.";
    return;
  }

  const file = input.files[0];
  const reader = new FileReader();

  reader.onload = function(e){

    const img = new Image();

    img.onload = function(){

      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");

      const maxWidth = 1200;

      let width = img.width;
      let height = img.height;

      if(width > maxWidth){
        height = height * (maxWidth / width);
        width = maxWidth;
      }

      canvas.width = width;
      canvas.height = height;

      ctx.drawImage(img,0,0,width,height);

      canvas.toBlob(function(blob){

        const url = URL.createObjectURL(blob);

        result.innerHTML =
        '<a class="download" href="' +
        url +
        '" download="quicktools-compressed.jpg">' +
        'Download Compressed Image' +
        '</a>';

      },"image/jpeg",0.7);

    };

    img.src = e.target.result;

  };

  reader.readAsDataURL(file);
}


function calculateAge(){

  const dobValue = document.getElementById("dob").value;

  if(!dobValue){
    document.getElementById("result").innerText =
    "Please select your date of birth.";
    return;
  }

  const dob = new Date(dobValue);
  const today = new Date();

  let years =
  today.getFullYear() - dob.getFullYear();

  let months =
  today.getMonth() - dob.getMonth();

  let days =
  today.getDate() - dob.getDate();

  if(days < 0){
    months--;
    days += new Date(
      today.getFullYear(),
      today.getMonth(),
      0
    ).getDate();
  }

  if(months < 0){
    years--;
    months += 12;
  }

  document.getElementById("result").innerText =
  "You are " +
  years +
  " years, " +
  months +
  " months and " +
  days +
  " days old.";

}
function resizeImage(){

  const input = document.getElementById("resizeInput");
  const width = parseInt(document.getElementById("resizeWidth").value);
  const height = parseInt(document.getElementById("resizeHeight").value);
  const result = document.getElementById("resizeResult");

  if(!input.files || !input.files[0]){
    result.innerText = "Please select an image first.";
    return;
  }

  if(!width || !height || width <= 0 || height <= 0){
    result.innerText = "Please enter valid width and height.";
    return;
  }

  const reader = new FileReader();

  reader.onload = function(e){

    const img = new Image();

    img.onload = function(){

      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");

      canvas.width = width;
      canvas.height = height;

      ctx.drawImage(img, 0, 0, width, height);

      canvas.toBlob(function(blob){

        const url = URL.createObjectURL(blob);

        result.innerHTML =
        '<a class="download" href="' +
        url +
        '" download="quicktools-resized.jpg">' +
        'Download Resized Image' +
        '</a>';

      }, "image/jpeg", 0.9);

    };

    img.src = e.target.result;

  };

  reader.readAsDataURL(input.files[0]);
}
</script>

</body>
</html>
