<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuickTools</title>

<style>
body{
  font-family:Arial;
  margin:0;
  background:#f5f7fb;
  text-align:center;
}

header{
  background:#111827;
  color:white;
  padding:35px;
}

h1{
  margin:0;
  font-size:40px;
}

.tools{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  align-items:flex-start;
  gap:20px;
  padding:35px;
}

.box{
  background:white;
  padding:25px;
  width:220px;
  border-radius:15px;
  box-shadow:0 3px 12px #ccc;
}

button{
  padding:10px 18px;
  background:#111827;
  color:white;
  border:0;
  border-radius:7px;
  cursor:pointer;
}

#age{
  background:white;
  margin:10px auto 40px;
  padding:25px;
  max-width:450px;
  border-radius:15px;
}

input{
  padding:10px;
}

#result{
  font-weight:bold;
  margin-top:20px;
}
</style>
</head>

<body>

<header>
<h1>QuickTools</h1>
<p>Simple & Free Online Tools</p>
</header>

<div class="tools">

<div class="box">
<h2>🖼️ Image Compressor</h2>
<p>Compress images easily.</p>
<button>Open Tool</button>
</div>

<div class="box">
<h2>📏 Image Resizer</h2>
<p>Resize your images online.</p>
<button>Open Tool</button>
</div>

<div class="box">
<h2>🧮 Age Calculator</h2>
<p>Calculate your age instantly.</p>
<button onclick="document.getElementById('age').scrollIntoView()">Open Tool</button>
</div>

<div class="box">
<h2>🔄 Unit Converter</h2>
<p>Convert different units easily.</p>
<button>Open Tool</button>
</div>

</div>

<div id="age">
<h2>Age Calculator</h2>
<input type="date" id="dob">
<br><br>
<button onclick="calculateAge()">Calculate Age</button>
<p id="result"></p>
</div>

<script>
function calculateAge(){

  const dobValue = document.getElementById("dob").value;

  if(!dobValue){
    document.getElementById("result").innerText =
    "Please select your date of birth.";
    return;
  }

  const dob = new Date(dobValue);
  const today = new Date();

  let years = today.getFullYear() - dob.getFullYear();
  let months = today.getMonth() - dob.getMonth();
  let days = today.getDate() - dob.getDate();

  if(days < 0){
    months--;
    days += new Date(
      today.getFullYear(),
      today.getMonth(),
      0
    ).getDate();
  }

  if(months < 0){
    years--;
    months += 12;
  }

  document.getElementById("result").innerText =
  `You are ${years} years, ${months} months and ${days} days old.`;
}
</script>

</body>
</html>
