<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickTools</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f7fb;
      text-align: center;
    }
    header {
      background: #111827;
      color: white;
      padding: 35px 15px;
    }
    h1 {
      margin: 0;
      font-size: 42px;
    }
    .subtitle {
      margin-top: 10px;
      color: #d1d5db;
    }
    .tools {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      padding: 35px 15px;
    }
    .tool {
      background: white;
      width: 230px;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,.08);
    }
    .tool h2 {
      font-size: 20px;
    }
    button {
      background: #111827;
      color: white;
      border: 0;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
    }
    footer {
      padding: 25px;
      color: #666;
    }
  </style>
</head>

<body>

<header>
  <h1>QuickTools</h1>
  <div class="subtitle">Simple & Free Online Tools</div>
</header>

<section class="tools">

  <div class="tool">
    <h2>🖼️ Image Compressor</h2>
    <p>Compress images easily.</p>
    <button>Open Tool</button>
  </div>

  <div class="tool">
    <h2>📏 Image Resizer</h2>
    <p>Resize your images online.</p>
    <button>Open Tool</button>
  </div>

  <div class="tool">
    <h2>🧮 Age Calculator</h2>
    <p>Calculate your age instantly.</p>
    <button>Open Tool</button>
  </div>

  <div class="tool">
    <h2>🔄 Unit Converter</h2>
    <p>Convert different units easily.</p>
    <button>Open Tool</button>
  </div>

</section>

<footer>
  © 2026 QuickTools — Free Online Tools
</footer>

</body>
</html>
